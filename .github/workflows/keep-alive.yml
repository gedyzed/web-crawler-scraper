name: Keep Backend Alive

on:
  schedule:
    # First ping — wakes the instance
    - cron: "0 6 * * *"
    # Second ping — 2 minutes later, hits after the instance is warm
    - cron: "2 6 * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://web-crawler-scraper-iunf.onrender.com/health)
          echo "Health check response: $response"
          if [ "$response" != "200" ]; then
            echo "::error::Health check failed with status $response"
            exit 1
          fi
          echo "✅ Backend is healthy"
