# IMPORTANT:
# Do not put real secrets in this file.
# Use environment variables or a local .env file to override sensitive values.
# This YAML is only a public-safe structure/template for configuration keys.

app:
  name: spidergo
  port: "8080"
  env: development
  debug: true
  domain: localhost
  secure_cookies: false

db:
  dns: postgres://postgres:postgres@localhost:5432/spidergo?sslmode=disable

redis:
  address: localhost:6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 2
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s
  max_retries: 2

security:
  min_entropy_bits: 30

rate_limiter:
  auth:
    limit: 5
    window: 1m
  trial:
    limit: 3
    window: 0s
  api_key:
    max_keys_per_user: 3
    daily_limit: 1000

jwt_config:
  access_key: replace-from-env
  refresh_key: replace-from-env
  access_ttl: 10m
  refresh_ttl: 48h

google_oauth:
  client_id: replace-from-env
  client_secret: replace-from-env
  redirect_url: http://localhost:8080/auth/google/callback
  user_url: https://www.googleapis.com/oauth2/v3/userinfo
  scopes:
    - openid
    - email
    - profile

github_oauth:
  client_id: replace-from-env
  client_secret: replace-from-env
  redirect_url: http://localhost:8080/auth/github/callback
  user_url: https://api.github.com/user
  scopes:
    - read:user
    - user:email

# email sending is using render
email:
  username: replace-from-env
  api_key: replace-from-env

crawler:
  max_depth: 3
  max_pages: 10
  max_concurrency: 10

scraper:
  max_links_per_page: 100
  max_images_per_page: 50
  max_products_per_page: 20



