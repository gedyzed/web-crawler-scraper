<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Reset Your Password</title>
</head>
<body style="margin:0; padding:0; background-color:#0b0f14; font-family: 'Inter', Arial, sans-serif; color: #dee4ea;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0b0f14; padding: 40px 0;">
    <tr>
      <td align="center">

        <table width="500" cellpadding="0" cellspacing="0" style="background-color:#101722; border-radius:12px; border: 1px solid #212a38; padding: 48px;">
          
          <tr>
            <td align="center" style="padding-bottom: 24px;">
              <div style="font-size: 28px; font-weight: 800; color: #0aadcc; letter-spacing: -0.025em;">
                SpiderGo
              </div>
            </td>
          </tr>

          <tr>
            <td align="center" style="font-size:24px; font-weight:bold; color:#dee4ea; padding-bottom: 16px;">
              Reset Your Password
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:0 0 24px 0; font-size:16px; color:#7b8694; line-height: 1.5;">
              Hello {{.Name}},  
              <br /><br />
              We received a request to reset your password. Use the code below to continue.
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:24px 0;">
              <div style="font-size:36px; letter-spacing:8px; font-weight:bold; color:#0aadcc; background-color:#171f2c; padding:20px 40px; display:inline-block; border-radius:8px; border: 1px solid #212a38;">
                {{.OTP}}
              </div>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:20px 0 0 0; font-size:14px; color:#7b8694;">
              This code will expire in <strong>{{.Expiry}} minutes</strong>.
            </td>
          </tr>

          <tr>
            <td align="center" style="padding-top:40px; font-size:12px; color:#4a5568; border-top: 1px solid #212a38; margin-top: 24px;">
              If you didn't request a password reset, you can safely ignore this email.
            </td>
          </tr>

        </table>

        <table width="500" cellpadding="0" cellspacing="0" style="padding: 24px 0;">
          <tr>
            <td align="center" style="font-size:12px; color:#4a5568;">
              &copy; 2026 SpiderGo. All rights reserved.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
