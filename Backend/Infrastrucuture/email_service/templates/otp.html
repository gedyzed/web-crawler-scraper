<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Your OTP Code</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding: 40px 0;">
    <tr>
      <td align="center">

        <table width="500" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; padding: 40px;">
          
          <tr>
            <td align="center" style="font-size:24px; font-weight:bold; color:#333333;">
              Verify Your Account
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:20px 0; font-size:16px; color:#555555;">
              Hello {{.Name}},  
              <br /><br />
              Use the verification code below to complete your sign-in.
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:20px 0;">
              <div style="font-size:32px; letter-spacing:8px; font-weight:bold; color:#111111; background-color:#f0f0f0; padding:15px 30px; display:inline-block; border-radius:6px;">
                {{.OTP}}
              </div>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:10px 0; font-size:14px; color:#888888;">
              This code will expire in {{.Expiry}} minutes.
            </td>
          </tr>

          <tr>
            <td align="center" style="padding-top:30px; font-size:12px; color:#aaaaaa;">
              If you didn't request this, you can safely ignore this email.
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
